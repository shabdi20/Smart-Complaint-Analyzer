{% extends 'base.html' %}{% block content %}<div class="page-head flex-head"><div><div class="eyebrow">YOUR REPORTS</div><h1>My complaints</h1></div><a class="btn" href="{{ url_for('citizen.submit') }}">＋ New complaint</a></div><div class="card"><form class="filters" method="get"><select name="status"><option value="">All statuses</option>{% for x in ['Submitted','Under Review','Assigned','In Progress','Resolved','Rejected'] %}<option value="{{ x }}" {% if request.args.get('status')==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select><select name="category"><option value="">All categories</option>{% for x in categories %}<option value="{{ x }}" {% if request.args.get('category')==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select><button class="btn">Filter</button></form>{% include 'citizen/_table.html' %}{% include '_pagination.html' %}</div>{% endblock %}
