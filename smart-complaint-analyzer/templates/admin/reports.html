{% extends 'base.html' %}{% block content %}<div class="page-head"><div class="eyebrow">DATA & REPORTING</div><h1>Complaint reports</h1><p>Export records from the live database. Filters apply to downloaded CSV.</p></div><div class="card form-card"><h2>Export filtered complaints</h2><p>Matching complaints: <b>{{ total }}</b></p><form method="get" action="{{ url_for('admin.export') }}"><label>Status<select name="status"><option value="">All statuses</option>{% for s in statuses %}<option>{{ s }}</option>{% endfor %}</select></label><label>Category<select name="category"><option value="">All categories</option>{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></label><label>Search<input name="q" placeholder="Title, location, city"></label><button class="btn">Download CSV ↓</button></form></div>{% endblock %}
