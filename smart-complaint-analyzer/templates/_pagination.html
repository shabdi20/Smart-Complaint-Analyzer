{% if items.pages>1 %}<div class="pagination">{% if items.has_prev %}<a href="{{ url_for(request.endpoint, page=items.prev_num, status=request.args.get('status',''),category=request.args.get('category',''),q=request.args.get('q','')) }}">← Previous</a>{% endif %}<span>Page {{ items.page }} of {{ items.pages }}</span>{% if items.has_next %}<a href="{{ url_for(request.endpoint,page=items.next_num,status=request.args.get('status',''),category=request.args.get('category',''),q=request.args.get('q','')) }}">Next →</a>{% endif %}</div>{% endif %}
